version: "3.1"

services:
  db:
    image: mariadb
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    container_name: redis
    hostname: redis
    image: redis
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"

  client-app:
    build:
      context: "./client"
    image: client-app
    command: "yarn client:dev"
    ports:
      - 3100:3100
    environment:
      WEBPACK_DEV_SERVER_PORT: 3100

  node-app:
    build:
      context: "./server"
    image: node-app
    command: "tail -f /dev/null"

  api-server:
    image: node-app
    ports:
      - 3000:3000
    command: "bash ./server.sh --api-server"
    environment:
      NODE_ENV: docker
      WATCH: "yes"
    restart: always
    depends_on:
      - node-app

  debug-command:
    image: node-app
    command: "bash ./server.sh --debug"
    environment:
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - node-app

volumes:
  db-data:
  redis-data:
