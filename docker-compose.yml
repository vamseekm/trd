version: "3.1"

services:
  i_rabbit:
    image: rabbitmq:3-management
    restart: always
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbit-data:/var/lib/rabbitmq:delegated
  # i_pg:
  #   image: postgres:12
  #   restart: always
  #   environment:
  #     POSTGRES_PASSWORD: example
  #   ports:
  #     - 127.0.0.1:5432:5432
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

  # i_db:
  #   image: mariadb:10
  #   restart: always
  #   command: "--innodb_flush_log_at_trx_commit=0"
  #   ports:
  #     - 127.0.0.1:3306:3306
  #   environment:
  #     MYSQL_ROOT_PASSWORD: example
  #   volumes:
  #     - db-data:/var/lib/mysql:delegated

  # i_adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 127.0.0.1:8080:8080

  i_redis:
    image: redis
    volumes:
      - redis-data:/data:delegated
    ports:
      - 127.0.0.1:6379:6379

  i_redis_interface:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: local:i_redis:6379
      ADDRESS: 0.0.0.0
      URL_PREFIX: /rc
    ports:
      - 8081:8081

  i_redis_insight:
    image: redislabs/redisinsight:latest
    restart: always
    ports:
      - 8001:8001
    volumes:
      - redis-insight-db:/db

  i_mongo:
    image: mongo:4.4-bionic
    restart: always
    ports:
      - 127.0.0.1:27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

  i_adminmongo:
    image: mrvautin/adminmongo
    ports:
      - 127.0.0.1:1234:1234
    environment:
      - HOST=0.0.0.0

  c_client_server:
    build:
      context: "./client"
    image: ${HTTP_CLIENT_SERVER_HOST}
    command: "yarn client:dev"
    ports:
      - ${HTTP_CLIENT_SERVER_PORT}:${HTTP_CLIENT_SERVER_PORT}
    environment:
      HTTP_CLIENT_SERVER_PORT: ${HTTP_CLIENT_SERVER_PORT}
    healthcheck:
      test: "curl --fail localhost:${HTTP_CLIENT_SERVER_PORT}/app || exit 1"
      interval: "30s"
      timeout: "1s"
      retries: 5

  c_server_img:
    build:
      context: "./server"
    image: c_server_img
    command: "tail -f /dev/null"
    environment:
      DATABASE_URL: postgresql://postgres:example@i_pg:5432/postgres

  c_api_server:
    image: c_server_img
    ports:
      - ${HTTP_API_SERVER_PORT}:${HTTP_API_SERVER_PORT}
    command: "bash ./server.sh --api-server"
    environment:
      DATABASE_URL: postgresql://postgres:example@i_pg:5432/postgres
      HTTP_API_SERVER_PORT: ${HTTP_API_SERVER_PORT}
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - c_server_img
    healthcheck:
      test: "curl --fail localhost:${HTTP_API_SERVER_PORT}/health || exit 1"
      interval: "20s"
      timeout: "1s"
      retries: 3

  # c_debug_command:
  #   image: c_server_img
  #   command: "bash ./server.sh --debug"
  #   environment:
  #     WATCH: "yes"
  #     NODE_ENV: docker
  #   restart: always
  #   depends_on:
  #     - c_server_img

  c_tick_listener:
    image: c_server_img
    command: "bash ./server.sh --tick-listener"
    environment:
      NODE_ENV: docker
    restart: always
    depends_on:
      - c_server_img

  c_tick_processor:
    image: c_server_img
    # command: "tail -f /dev/null"
    command: "bash ./server.sh --raw-tick-consumer --tick-store-consumer"
    environment:
      NODE_ENV: docker
    restart: always
    depends_on:
      - c_server_img

volumes:
  db-data:
  redis-data:
  rabbit-data:
  stan-data:
  redis-insight-db:
  mongo-data:
  pg-data:
