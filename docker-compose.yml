version: "3.4"
x-node-config: &node-config
  image: trd_be_node_img
  depends_on:
    - build
  working_dir: /home/node/app
  volumes: 
    - ./:/home/node/app
    - /home/node/app/node_modules
  environment:
    - HTTP_API_PORT=2000
x-env: &common-env
  - MYSQL_ROOT_PASSWORD: example

services: 

  build:
    image: trd_be_node_img
    build: .

  api_dev_server:
    <<: *node-config
    ports: 
      - 127.0.0.1:2000:2000
    command: "./server_dev.sh"

  client_dev_server:
    <<: *node-config
    ports: 
      - 127.0.0.1:3000:3000
    command: "npm run client:dev"

  db:
    image: mariadb
    restart: always
    environment: 
      <<: *common-env
    volumes: 
      - ../trd_mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:8088:8080
  nginx:
    image: nginx:latest
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./config/nginx/reverse_proxy.conf:/etc/nginx/conf.d/reverse_proxy.conf
    depends_on: 
      - api_dev_server
      - client_dev_server

