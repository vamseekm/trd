version: "3.1"

services:
  nginx:
    build:
      context: "./conf/nginx"
    container_name: nginx
    restart: always
    ports:
      - 3000:3000
    environment:
      - HTTP_API_SERVER_HOST:${HTTP_API_SERVER_HOST}
      - HTTP_API_SERVER_PORT:${HTTP_API_SERVER_PORT}
      - HTTP_CLIENT_SERVER_HOST:${HTTP_CLIENT_SERVER_HOST}
      - HTTP_CLIENT_SERVER_PORT:${HTTP_CLIENT_SERVER_PORT}

  db:
    image: mariadb
    container_name: mariadb
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    container_name: redis
    hostname: redis
    image: redis
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"

  client-server:
    build:
      context: "./client"
    container_name: ${HTTP_CLIENT_SERVER_HOST}
    image: ${HTTP_CLIENT_SERVER_HOST}
    command: "yarn client:dev"
    ports:
      - ${HTTP_CLIENT_SERVER_PORT}:${HTTP_CLIENT_SERVER_PORT}
    environment:
      HTTP_CLIENT_SERVER_PORT: ${HTTP_CLIENT_SERVER_PORT}

  node-app:
    build:
      context: "./server"
    image: node-app
    container_name: node-app
    command: "tail -f /dev/null"

  api-server:
    image: node-app
    container_name: ${HTTP_API_SERVER_HOST}
    ports:
      - ${HTTP_API_SERVER_PORT}:${HTTP_API_SERVER_PORT}
    command: "bash ./server.sh --api-server"
    environment:
      HTTP_API_SERVER_PORT: ${HTTP_API_SERVER_PORT}
      NODE_ENV: docker
      WATCH: "yes"
    restart: always
    depends_on:
      - node-app

  debug-command:
    image: node-app
    container_name: debug-command
    command: "bash ./server.sh --debug"
    environment:
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - node-app

volumes:
  db-data:
  redis-data:
