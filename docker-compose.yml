version: "3.1"

services:
  traefik:
    image: traefik
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.bufferingsize=100"
    ports:
      - "3000:80"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/logs

  db:
    image: mariadb
    container_name: mariadb
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Path(`/db`)"
      - "traefik.http.routers.adminer.entrypoints=web"

  redis:
    container_name: redis
    hostname: redis
    image: redis
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
      ADDRESS: 0.0.0.0
      URL_PREFIX: /rc
    ports:
      - 8081:8081
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rediscommander.rule=PathPrefix(`/rc`)"
      - "traefik.http.routers.rediscommander.entrypoints=web"

  client-server:
    build:
      context: "./client"
    container_name: ${HTTP_CLIENT_SERVER_HOST}
    image: ${HTTP_CLIENT_SERVER_HOST}
    command: "yarn client:dev"
    ports:
      - ${HTTP_CLIENT_SERVER_PORT}:${HTTP_CLIENT_SERVER_PORT}
    environment:
      HTTP_CLIENT_SERVER_PORT: ${HTTP_CLIENT_SERVER_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.client-server.rule=PathPrefix(`/app`)
      - traefik.http.routers.client-server.middlewares=compress
      - traefik.http.middlewares.compress.compress=true
      - traefik.http.routers.client-server.entrypoints=web

  node-app:
    build:
      context: "./server"
    image: node-app
    container_name: node-app
    command: "tail -f /dev/null"

  api-server:
    image: node-app
    container_name: ${HTTP_API_SERVER_HOST}
    ports:
      - ${HTTP_API_SERVER_PORT}:${HTTP_API_SERVER_PORT}
    command: "bash ./server.sh --api-server"
    environment:
      HTTP_API_SERVER_PORT: ${HTTP_API_SERVER_PORT}
      NODE_ENV: docker
      WATCH: "yes"
    restart: always
    depends_on:
      - node-app
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-server.rule=(PathPrefix(`/api`) || Path(`/health`))
      - traefik.http.routers.api-server.middlewares=compress
      - traefik.http.middlewares.compress.compress=true
      - traefik.http.routers.api-server.entrypoints=web

  debug-command:
    image: node-app
    container_name: debug-command
    command: "tail -f /dev/null"
    # command: "bash ./server.sh --debug"
    environment:
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - node-app

volumes:
  db-data:
  redis-data:
