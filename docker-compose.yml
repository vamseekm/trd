version: "3.4"
x-node-config: &node-config
  image: trd_be_node_img
  depends_on:
    - build
  working_dir: /home/node/app
  volumes: 
    - ./:/home/node/app
    - /home/node/app/node_modules

x-env: &common-env
  - MYSQL_ROOT_PASSWORD: example
  - HTTP_API_PORT: 2000
  - WEBPACK_DEV_SERVER_PORT: 3000
  - MYSQL_HOST: db
  - MYSQL_PORT: 3306
  - MYSQL_USER: root
  - MYSQL_PASSWORD: example
  - REDIS_HOST: redis
  - REDIS_PORT: 6379
  - GATEWAY_URI: http://gateway:8080

services: 

  build:
    image: trd_be_node_img
    build: .

  api_dev_server:
    <<: *node-config
    ports: 
      - 127.0.0.1:2000:2000
    command: "./server_dev.sh --api-server"
    environment: 
      <<: *common-env

  client_dev_server:
    <<: *node-config
    ports: 
      - 127.0.0.1:3000:3000
    command: "npm run client:dev"
    environment: 
      <<: *common-env

  db:
    image: mariadb
    restart: always
    ports:
      - 127.0.0.1:3306:3306
    environment: 
      <<: *common-env
    volumes: 
      - ../trd_mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:8088:8080

  redis:
    image: redis
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ../trd_redis_data:/data

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - 127.0.0.1:8081:8081

  gateway:
    image: nginx:latest
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./config/nginx/reverse_proxy.conf:/etc/nginx/conf.d/reverse_proxy.conf
    depends_on: 
      - api_dev_server
      - client_dev_server

