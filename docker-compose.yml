version: "3.1"

services:
  rabbit:
    image: rabbitmq:3-management
    container_name: infra_rabbit
    restart: always
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbit-data:/var/lib/rabbitmq:delegated

  db:
    image: mariadb:10
    container_name: infra_db
    restart: always
    command: "--innodb_flush_log_at_trx_commit=0"
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql:delegated

  adminer:
    image: adminer
    container_name: infra_db_interface
    restart: always
    ports:
      - 127.0.0.1:8080:8080

  redis:
    image: redis
    container_name: infra_redis
    volumes:
      - redis-data:/data:delegated
    ports:
      - 127.0.0.1:6379:6379

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: infra_redis_interface
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
      ADDRESS: 0.0.0.0
      URL_PREFIX: /rc
    ports:
      - 8081:8081

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: infra_redis_insight
    restart: always
    ports:
      - 8001:8001
    volumes:
      - redis-insight-db:/db

  client-server:
    build:
      context: "./client"
    container_name: code_client_server
    image: ${HTTP_CLIENT_SERVER_HOST}
    command: "yarn client:dev"
    ports:
      - ${HTTP_CLIENT_SERVER_PORT}:${HTTP_CLIENT_SERVER_PORT}
    environment:
      HTTP_CLIENT_SERVER_PORT: ${HTTP_CLIENT_SERVER_PORT}
    healthcheck:
      test: "curl --fail localhost:${HTTP_CLIENT_SERVER_PORT}/app || exit 1"
      interval: "30s"
      timeout: "1s"
      retries: 5

  server-img:
    build:
      context: "./server"
    container_name: code_server_img
    image: server-img
    command: "tail -f /dev/null"

  api-server:
    image: server-img
    container_name: code_api_server
    ports:
      - ${HTTP_API_SERVER_PORT}:${HTTP_API_SERVER_PORT}
    command: "bash ./server.sh --api-server"
    environment:
      HTTP_API_SERVER_PORT: ${HTTP_API_SERVER_PORT}
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - server-img
    healthcheck:
      test: "curl --fail localhost:${HTTP_API_SERVER_PORT}/health || exit 1"
      interval: "20s"
      timeout: "1s"
      retries: 3

  debug-command:
    image: server-img
    container_name: code_debug_command
    command: "bash ./server.sh --debug"
    environment:
      WATCH: "yes"
      NODE_ENV: docker
    restart: always
    depends_on:
      - server-img

  tick-listener:
    image: server-img
    container_name: code_tick_publisher
    command: "bash ./server.sh --tick-listener"
    environment:
      NODE_ENV: docker
    restart: always
    depends_on:
      - server-img

  tick-processor:
    image: server-img
    container_name: code_tick_processor
    # command: "tail -f /dev/null"
    command: "bash ./server.sh --raw-tick-consumer --tick-store-consumer"
    environment:
      NODE_ENV: docker
    restart: always
    depends_on:
      - server-img

volumes:
  db-data:
  redis-data:
  rabbit-data:
  stan-data:
  redis-insight-db:
