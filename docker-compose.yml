version: "3.1"

services:
  traefik:
    image: traefik
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.bufferingsize=100"
      - --providers.file.directory=/etc/traefik/dynamic_conf
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./conf/etc/certs:/etc/certs
      - ./conf/etc/traefik/dynamic_conf:/etc/traefik/dynamic_conf:ro
      - ./logs:/logs

  db:
    image: mariadb
    container_name: mariadb
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Path(`/db`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.tls=true"

  redis:
    container_name: redis
    hostname: redis
    image: redis
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
      ADDRESS: 0.0.0.0
      URL_PREFIX: /rc
    ports:
      - 8081:8081
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rediscommander.rule=PathPrefix(`/rc`)"
      - "traefik.http.routers.rediscommander.entrypoints=web"
      - "traefik.http.routers.rediscommander.tls=true"

  client-server:
    build:
      context: "./client"
    container_name: ${HTTP_CLIENT_SERVER_HOST}
    image: ${HTTP_CLIENT_SERVER_HOST}
    command: "yarn client:dev"
    ports:
      - ${HTTP_CLIENT_SERVER_PORT}:${HTTP_CLIENT_SERVER_PORT}
    environment:
      HTTP_CLIENT_SERVER_PORT: ${HTTP_CLIENT_SERVER_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.client-server.rule=PathPrefix(`/app`)
      - traefik.http.routers.client-server.entrypoints=web
      - traefik.http.routers.client-server.middlewares=client-server-mw
      - traefik.http.middlewares.client-server-mw.redirectscheme.scheme=https
      - traefik.http.middlewares.client-server-mw.redirectscheme.permanent=true
      - traefik.http.routers.client-server-secure.rule=PathPrefix(`/app`)
      - traefik.http.routers.client-server-secure.entrypoints=websecure
      - traefik.http.routers.client-server-secure.tls=true
      - traefik.http.routers.client-server-secure.middlewares=client-server-secure-mw
      - traefik.http.middlewares.client-server-secure-mw.compress=true

  server-img:
    build:
      context: "./server"
    image: server-img
    container_name: server-img
    command: "tail -f /dev/null"

  api-server:
    image: server-img
    container_name: ${HTTP_API_SERVER_HOST}
    ports:
      - ${HTTP_API_SERVER_PORT}:${HTTP_API_SERVER_PORT}
    command: "bash ./server.sh --api-server"
    environment:
      HTTP_API_SERVER_PORT: ${HTTP_API_SERVER_PORT}
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - server-img
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-server.rule=(PathPrefix(`/api`) || Path(`/health`))
      - traefik.http.routers.api-server.entrypoints=web
      - traefik.http.routers.api-server.middlewares=api-server-mw
      - traefik.http.middlewares.api-server-mw.redirectscheme.scheme=https
      - traefik.http.middlewares.api-server-mw.redirectscheme.permanent=true
      - traefik.http.routers.api-server-secure.rule=(PathPrefix(`/api`) || Path(`/health`))
      - traefik.http.routers.api-server-secure.entrypoints=websecure
      - traefik.http.routers.api-server-secure.tls=true
      - traefik.http.routers.api-server-secure.middlewares=api-server-secure-mw
      - traefik.http.middlewares.api-server-secure-mw.compress=true

  debug-command:
    image: server-img
    container_name: debug-command
    # command: "tail -f /dev/null"
    command: "bash ./server.sh --debug"
    environment:
      NODE_ENV: docker
      WATCH: "yes"
    restart: always
    depends_on:
      - server-img

volumes:
  db-data:
  redis-data:
  rabbit-data:
