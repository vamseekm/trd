version: "3.1"

services:
  rabbit:
    image: rabbitmq:3-management
    restart: always
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbit-data:/var/lib/rabbitmq:delegated

  db:
    image: mariadb:10
    restart: always
    command: "--innodb_flush_log_at_trx_commit=0"
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql:delegated

  adminer:
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:8080:8080

  redis:
    image: redis
    volumes:
      - redis-data:/data:delegated
    ports:
      - 6379:6379

  redis-commander:
    container_name: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
      ADDRESS: 0.0.0.0
      URL_PREFIX: /rc
    ports:
      - 8081:8081

  client-server:
    build:
      context: "./client"
    container_name: ${HTTP_CLIENT_SERVER_HOST}
    image: ${HTTP_CLIENT_SERVER_HOST}
    command: "yarn client:dev"
    ports:
      - ${HTTP_CLIENT_SERVER_PORT}:${HTTP_CLIENT_SERVER_PORT}
    environment:
      HTTP_CLIENT_SERVER_PORT: ${HTTP_CLIENT_SERVER_PORT}

  server-img:
    build:
      context: "./server"
    image: server-img
    container_name: server-img
    command: "tail -f /dev/null"

  api-server:
    image: server-img
    ports:
      - ${HTTP_API_SERVER_PORT}:${HTTP_API_SERVER_PORT}
    command: "bash ./server.sh --api-server"
    environment:
      HTTP_API_SERVER_PORT: ${HTTP_API_SERVER_PORT}
      NODE_ENV: docker
      # WATCH: "yes"
    restart: always
    depends_on:
      - server-img

  debug-command:
    image: server-img
    command: "bash ./server.sh --debug"
    environment:
      WATCH: "yes"
      NODE_ENV: docker
    restart: always
    depends_on:
      - server-img

  tick-listener:
    image: server-img
    command: "bash ./server.sh --tick-listener"
    environment:
      NODE_ENV: docker
    restart: always
    depends_on:
      - server-img

  tick-processor:
    image: server-img
    # command: "tail -f /dev/null"
    command: "bash ./server.sh --raw-tick-consumer --tick-store-consumer"
    environment:
      NODE_ENV: docker
    restart: always
    depends_on:
      - server-img

volumes:
  db-data:
  redis-data:
  rabbit-data:
  stan-data:
