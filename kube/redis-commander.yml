apiVersion: v1
kind: Service
metadata:
  name: rediscom
spec:
  selector:
    app: rediscom
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rediscom
spec:
  selector:
    matchLabels:
      app: rediscom
  template:
    metadata:
      labels:
        app: rediscom
    spec:
      containers:
        - name: rediscom
          image: rediscommander/redis-commander:latest
          ports:
            - containerPort: 8081
              name: rediscom
              hostPort: 8081
          env:
            - name: REDIS_HOSTS
              value: local:redis:6379
