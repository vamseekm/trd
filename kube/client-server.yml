apiVersion: v1
kind: Service
metadata:
  name: client-server
spec:
  selector:
    app: client-server
  ports:
    - port: 3200
      targetPort: 3200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-server
spec:
  selector:
    matchLabels:
      app: client-server
  template:
    metadata:
      labels:
        app: client-server
    spec:
      containers:
        - name: client-server
          image: localhost:32000/trd-client
          imagePullPolicy: "Always"
          command:
            - "yarn"
            - "client:dev"
          ports:
            - containerPort: 3200
              hostPort: 3200
          env:
            - name: "HTTP_CLIENT_SERVER_PORT"
              value: "3200"
