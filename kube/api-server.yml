apiVersion: v1
kind: Service
metadata:
  name: api-server
spec:
  selector:
    app: api-server
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: localhost:32000/trd-server
          imagePullPolicy: "Always"
          command:
            - "bash"
            - "./server.sh"
            - "--api-server"
          ports:
            - containerPort: 3100
              hostPort: 3100
          env:
            - name: "HTTP_API_SERVER_PORT"
              value: "3100"
            - name: "NODE_ENV"
              value: "docker"
