apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbit-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/vamsee/storage/rabbit"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbit-pv-claim
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit
spec:
  selector:
    app: rabbit
  ports:
    - port: 5672
      targetPort: 5672
      name: rabbit-port
    - port: 15672
      targetPort: 15672
      name: rabbit-mgmt-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit
spec:
  selector:
    matchLabels:
      app: rabbit
  template:
    metadata:
      labels:
        app: rabbit
    spec:
      containers:
        - name: rabbit
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
              name: rabbit-port
            - containerPort: 15672
              hostPort: 15672
              name: rabbitm-port
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: rabbit-storage
      volumes:
        - name: rabbit-storage
          persistentVolumeClaim:
            claimName: rabbit-pv-claim
