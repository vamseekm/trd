apiVersion: v1
kind: Service
metadata:
  name: redis-commander
spec:
  selector:
    app: redis-commander
  type: NodePort
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 31001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander
spec:
  selector:
    matchLabels:
      app: redis-commander
  replicas: 1
  template:
    metadata:
      labels:
        app: redis-commander
    spec:
      containers:
      - name: redis-commander
        image: rediscommander/redis-commander:latest
        ports:
        - containerPort: 8081
        env:
          - name: REDIS_HOSTS
            value: instance1:redis:6379
